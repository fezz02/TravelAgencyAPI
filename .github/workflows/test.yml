name: Test

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Configura PHP 8.2
      - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
        with:
          php-version: '8.2'

      # Effettua il checkout del repository
      - uses: actions/checkout@v4

      # Copia il file .env.example in .env se non esiste
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      # Installa le dipendenze di Composer
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # Genera la chiave di applicazione
      - name: Generate key
        run: php artisan key:generate

      # Imposta le autorizzazioni delle directory necessarie
      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      # Esegui la test suite completa usando composer
      - name: Run Composer Test Suite
        run: composer test
